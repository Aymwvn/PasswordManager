name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static analysis (bandit)
        run: bandit -r src -q
      - name: Audit the app's runtime dependencies
        # Audit what ships to users (the app + its dependencies) in a clean environment.
        # Auditing the CI runner itself flags the runner's own pip/setuptools and the dev tools,
        # which says nothing about the app and makes this job fail for reasons we don't control.
        run: |
          python -m venv --without-pip audit-env
          python -m pip --python audit-env/bin/python install ".[ui,app]"
          pip-audit --path audit-env/lib/python*/site-packages
