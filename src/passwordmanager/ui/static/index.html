<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PasswordManager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main id="screen-auth" class="auth hidden">
    <form id="auth-form" class="card" autocomplete="off">
      <h1>PasswordManager</h1>
      <p id="auth-hint" class="muted"></p>
      <label>Master password
        <input id="auth-password" type="password" autocomplete="current-password" required>
      </label>
      <label id="auth-confirm-row" class="hidden">Confirm master password
        <input id="auth-confirm" type="password" autocomplete="new-password">
      </label>
      <p id="auth-error" class="error" role="alert"></p>
      <button id="auth-submit" class="primary" type="submit">Unlock</button>
    </form>
  </main>

  <div id="screen-app" class="app hidden">
    <header class="topbar">
      <strong>PasswordManager</strong>
      <input id="search" type="search" placeholder="Search name, username, URL..." aria-label="Search">
      <span id="timer" class="muted"></span>
      <button id="btn-new" class="primary" type="button">+ New</button>
      <button id="btn-lock" type="button">Lock</button>
    </header>
    <div class="layout">
      <ul id="entry-list" class="list"></ul>
      <section id="detail" class="detail"></section>
    </div>
  </div>

  <dialog id="entry-dialog">
    <form id="entry-form" autocomplete="off">
      <h2 id="entry-title">New entry</h2>
      <label>Name <input id="f-name" required maxlength="200"></label>
      <label>Username <input id="f-username" maxlength="500"></label>
      <label>URL <input id="f-url" maxlength="2000"></label>
      <label>Password
        <div class="row">
          <input id="f-password" type="password" maxlength="1024" autocomplete="new-password">
          <button id="btn-toggle-pw" type="button">Show</button>
        </div>
      </label>
      <div class="meter"><div id="meter-bar" class="meter-bar"></div></div>
      <p id="meter-label" class="muted"></p>
      <div class="row gen">
        <label class="inline">Length <input id="gen-length" type="number" min="8" max="128" value="20"></label>
        <label class="inline"><input id="gen-symbols" type="checkbox" checked> Symbols</label>
        <button id="btn-generate" type="button">Generate</button>
      </div>
      <label>Notes <textarea id="f-notes" rows="3" maxlength="10000"></textarea></label>
      <p id="entry-error" class="error" role="alert"></p>
      <div class="row end">
        <button id="btn-cancel" type="button">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
