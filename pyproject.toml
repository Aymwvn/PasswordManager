[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passwordmanager"
version = "0.1.0"
description = "Local, encrypted password manager. Argon2id + AES-256-GCM, CLI and hardened web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
dev = ["pytest>=8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7", "pyperclip>=1.8"]

[project.scripts]
passwordmanager = "passwordmanager.cli.main:main"
pm = "passwordmanager.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
