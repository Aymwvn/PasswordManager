[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passwordmanager"
version = "0.4.0"
description = "Local, encrypted password manager. Argon2id + AES-256-GCM, CLI and hardened web UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5"]
build = ["pyinstaller>=6", "pillow>=10"]
dev = [
    "pytest>=8", "ruff>=0.5", "bandit>=1.7", "pip-audit>=2.7",
    "pyperclip>=1.8", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "hypothesis>=6.100",
]

[project.scripts]
passwordmanager = "passwordmanager.cli.main:main"
pm = "passwordmanager.cli.main:main"

[project.gui-scripts]
pm-app = "passwordmanager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passwordmanager = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E401", "E501", "E701", "E702", "I001"]
"tests/*" = ["E501"]
